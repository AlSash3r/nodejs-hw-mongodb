responses:
  '200':
    description: Successful response - contact details
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: Bad request - Invalid contact ID
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Invalid contact ID"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Not found"
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Authentication failed or token is invalid"
  '500':
    description: Server error
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Server error"
